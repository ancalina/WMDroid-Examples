plugins { id 'com.android.application' }
android {
    namespace 'me.ancal.wmdroid.widgets'
    compileSdk 35
    defaultConfig {
        applicationId 'me.ancal.wmdroid.widgets'
        minSdk 14
        targetSdk 35
        multiDexEnabled true
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes { release { debuggable false } }
    sourceSets.main.assets.srcDir rootProject.file('runtime-assets')
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation files(rootProject.file('libs/WMDroid-sdk.aar'))
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.multidex:multidex:2.0.1'
}
tasks.named('preBuild').configure {
    doFirst {
        if (!rootProject.file('libs/WMDroid-sdk.aar').isFile()) {
            throw new GradleException('Place the published SDK AAR in libs/WMDroid-sdk.aar')
        }
    }
}
